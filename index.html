radient(45deg,#ffb16e55,#ffb16e55 3px,#ffb16e15 3px,#ffb16e15 6px);border-color:#ffb16e77}.segment.urgent{background:#ff778245;border-color:#ff7782;color:#ffd6da}.gantt-row{margin-bottom:22px}.track{height:38px;position:relative;background:#091317;border-radius:5px;margin-top:8px}.nowline{position:absolute;top:0;bottom:0;width:1px;background:var(--mint);z-index:2}.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:11px;color:var(--muted);margin:14px 0}.legend i{display:inline-block;width:9px;height:9px;background:var(--teal);margin-right:6px;border-radius:2px}.legend .l-prep{background:var(--orange)}.legend .l-frozen{background:#63787f}.legend .l-urgent{background:var(--red)}.controls-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:end}.controls-row label{display:grid;gap:7px;font-size:12px;color:var(--muted)}.controls-row input{width:100px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px;color:var(--text)}.model-details{border:1px solid var(--line);border-radius:9px;padding:0 19px;background:var(--panel)}.model-details summary{cursor:pointer;padding:17px 0;font-size:14px;color:var(--teal)}.model-details .equation{margin-bottom:15px;overflow-x:auto}.definition{font-size:13px;color:var(--muted);line-height:1.8}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hero{min-height:360px}.heroart{height:130px}.hero h2{font-size:clamp(28px,3vw,44px)}.announce{color:var(--mint);font-size:12px;line-height:1.6;min-height:20px}.comparison .metric strong{font-size:24px}.formula sub{font-size:.65em}.note-pill{color:var(--orange);font:11px var(--mono)}.sidebar>.sidefoot{text-transform:none}.pagecount{align-self:start}.caption{margin-top:7px}.constraint-number{font:11px var(--mono);color:var(--muted);margin-right:9px}.model-details[open] summary{border-bottom:1px solid var(--line)}.navstep:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:3px}.hero .lead{max-width:650px}.read <body><div class="shell">
<header class="topbar"><div class="brand"><div class="brandmark">s/</div><div class="brandname">soc decision lab<small>tez modeli · 31 ekim 2026</small></div></div><div class="toptools"><span class="status">sentetik veri · arastirma prototipi</span><button class="btn small" id="motionBtn">hareketi durdur</button><button class="btn small" id="notesBtn" aria-pressed="false">anlatim notlari</button><button class="btn small" id="fullBtn" aria-label="tam ekran">⛶ tam ekran</button></div></header>
<div class="layout"><nav class="sidebar" aria-label="ana menu"><div class="eyebrow">arastirmadan karara</div><div id="navItems"></div><div class="sidefoot"><strong>endustri muhendisligi × soc</strong><br>atama + siralama<br>tek amac: agirlikli sla gecikmesi<br><br>devam eden is korunur.<br>bekleyen kuyruk yeniden planlanir.</div></nav><main id="main"><div class="stephead"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title" tabindex="-1"></h1><p id="subtitle"></p></div><div class="pagecount"><b id="pageNum"></b> / 09</div></div><section id="content" class="content" aria-label="sayfa icerigi"></section><aside class="notes" id="notes"></aside><footer class="bottom"><div class="progress" id="progress" aria-hidden="true"></div><span class="keyhint">← → bolumler · n notlar · f tam ekran</span><div class="controls"><button class="btn" id="prevBtn">← geri</button><button class="btn primary" id="nextBtn">devam et →</button></div></footer></main></div></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const fmt=n=>Number(n.toFixed(2)).toLocaleString('tr-TR');
const risk={dusuk:1,orta:3,yuksek:6,acil:10};
const sla={dusuk:45,orta:30,yuksek:20,acil:10};
const analysts=[{name:'deniz',expertise:5,color:'#64d3c3',a:0,b:90},{name:'ece',expertise:4,color:'#b8f397',a:0,b:90},{name:'mert',expertise:3,color:'#85bfff',a:0,b:90}];
const ongoing=[{id:'a01',name:'ag kaydi incelemesi',level:2,severity:'orta',j:0,h:0,s:0,c:18},{id:'a02',name:'uc nokta incelemesi',level:4,severity:'yuksek',j:1,h:0,s:0,c:24},{id:'a03',name:'kimlik kaydi incelemesi',level:3,severity:'orta',j:2,h:0,s:0,c:16}];
const pending=[
{id:'a04',name:'tekrarlayan port taramasi',severity:'dusuk',level:2,r:0,p:[14,18,16]},
{id:'a05',name:'supheli komut calistirma',severity:'yuksek',level:4,r:0,p:[20,16,24]},
{id:'a06',name:'olagandisi bulut oturumu',severity:'orta',level:3,r:0,p:[16,23,14]},
{id:'a07',name:'karmasik dosya incelemesi',severity:'orta',level:5,r:0,p:[18,25,30]},
{id:'a08',name:'aktif veri sizintisi',severity:'acil',level:5,r:6,p:[12,20,28]}
].map(a=>({...a,w:risk[a.severity],d:a.r+sla[a.severity]}));
let state={page:'overview',newAlarm:false,alpha:1,beta:.5,notes:false,motion:true,modelOpen:false};
const pages=[
['overview','tez ozeti','01 / problem tanimi','alarmdan cizelgeye.','guvenlik alarmlarini uygun analistlere ata; hazirlik surelerini ve sla hedeflerini birlikte dusun.'],
['scenario','alarm ve analistler','02 / girdiler','ayni kuyruk, farkli gereksinimler.','kritiklik, gerekli uzmanlik ve dakika cinsinden inceleme suresi birbirinden ayri ozelliklerdir.'],
['simulation','dinamik demo','03 / yeniden cizelgeleme','is devam eder. kuyruk degisir.','yeni acil alarm 6. dakikada gelir. baslamis incelemeler sabit; bekleyenlerin atamasi ve sirasi yeniden hesaplanir.'],
['model','problem ve amac','04 / tez modeli','tek amac, acik kararlar.','risk agirlikli toplam incelemeye baslama gecikmesini en aza indiren atama ve siralama modeli.'],
['parameters','parametreler','05 / model girdileri','model neyi biliyor?','girdi parametreleri, birimleri ve operasyonel anlamlari.'],
['variables','karar degiskenleri','06 / kararlar','model neyi belirliyor?','alarm atamasi, analist basina is sirasi ve zaman kararlari.'],
['constraints','kisitlar','07 / matematiksel model','uygulanabilir bir planin kurallari.','her kisiti acarak matematiksel ifadesini, anlamini ve uygulama notunu incele.'],
['setup','hazirlik suresi','08 / secilen fikir','gecis yonu fark yaratir.','onceki ve sonraki alarmin gerektirdigi uzmanlik seviyelerine bagli asimetrik hazirlik.'],
['assumptions','varsayimlar ve alternatifler','09 / arastirma kapsami','neyi varsayiyoruz, neyi olcecegiz?','modelin sinirlari, dinamik uygulama politikasi ve secilmeyen iki alternatif.']
];
const noteText={overview:'alarm = is; analist = paralel makine. temel karar hem atama hem siralama. tek amac risk agirlikli sla gecikmesi; is yuku dengesi ilk modelde ayri bir performans gostergesi.',scenario:'kritiklik aciliyeti, uzmanlik inceleme gereksinimini anlatir. kritik bir alarm kolay, dusuk kritik bir alarm zor olabilir. verilen sureler tahmin ve bu demo verileri tamamen sentetiktir.',simulation:'uc inceleme 0. dakikada basladi ve 6. dakikada hala devam ediyor. acil alarm ekledigimizde sadece baslamamis isleri yeniden planliyoruz. acil alarm icin mutlak ilk siraya alma kurali yok.',model:'model tamamlanma gecikmesini degil incelemeye baslama gecikmesini olcer. pi_j sirali bir listedir; burada tam model sira listeleri ve kosullu kisitlarla ifade edilmistir, calisan bir genel MILP cozucusu degildir.',parameters:'agirliklar ve sla sureleri ornek degerlerdir. uzmanlik seviyeleri sirali ve kapsayicidir. gercekte farkli uzmanlik alanlari gerekirse uygunluk matrisi genisletilebilir.',variables:'hazirliga baslama h_i, incelemeye baslama s_i, tamamlanma C_i. sla s_i ile olculur. x ve pi birlikte atamayi ve sirayi belirler.',constraints:'hazirlik da analisti mesgul eder. her alarm bir kez atanir; alarm gelmeden hazirlik baslamaz; inceleme vardiya icinde biter. kaynaklar yetersizse model uygulanamaz sonucu vermelidir.',setup:'5ten 2ye gecisin 5ten 4e gecisten daha kisa oldugu varsayimi ozellikle uzman gorusuyle sinanacak. ayni seviyede sifir olan, yalnizca seviye degisiminden dogan ek hazirliktir.',assumptions:'gelecek alarmlarin tamamini onceden biliyor varsaymiyoruz. her yeni alarmda bilinen bekleyen isleri yeniden planliyoruz. islem veya hazirligi baslayan isler korunur. deneylerde iki politika da ayni gerceklesen hazirlik sureleriyle olculmelidir.'};
function setupTime(from,to,alpha=state.alpha,beta=state.beta){if(from===null||from===undefined||from===to)return 0;return to>from?alpha*(to-from)**2:beta/(from-to);}
function jobs(include=state.newAlarm){return pending.slice(0,include?5:4);}
function schedule(list,alpha=state.alpha,beta=state.beta,now=6,staff=analysts,frozen=ongoing){
 const ready=staff.map((a,j)=>Math.max(now,a.a,...frozen.filter(o=>o.j===j).map(o=>o.c)));
 const previous=staff.map((a,j)=>{const f=frozen.filter(o=>o.j===j).sort((a,b)=>b.c-a.c)[0];return f?f.level:null;});
 let best=null,leaves=0;const rows=[];
 function visit(remaining,z,finish,prep){
  if(best&&z>best.z+1e-9)return;
  if(!remaining.length){leaves++;if(!best||z<best.z-1e-9||(Math.abs(z-best.z)<1e-9&&(finish<best.finish-1e-9||(Math.abs(finish-best.finish)<1e-9&&prep<best.prep))))best={z,finish,prep,rows:rows.map(r=>({...r}))};return;}
  for(let n=0;n<remaining.length;n++){
   const a=remaining[n],rest=remaining.filter((_,k)=>k!==n);
   for(let j=0;j<staff.length;j++){
    if(staff[j].expertise<a.level)continue;
    const q=setupTime(previous[j],a.level,alpha,beta),h=Math.max(ready[j],a.r),s=h+q,c=s+a.p[j];
    if(c>staff[j].b+1e-9)continue;
    const t=Math.max(0,s-a.d),oldReady=ready[j],oldPrev=previous[j];
    rows.push({...a,j,q,h,s,c,t});ready[j]=c;previous[j]=a.level;
    visit(rest,z+a.w*t,finish+c,prep+q);
    rows.pop();ready[j]=oldReady;previous[j]=oldPrev;
   }
  }
 }
 visit(list,0,0,0);return best?{...best,leaves}:null;
}
function fifo(list,alpha=state.alpha,beta=state.beta){
 const ready=ongoing.map(o=>o.c),previous=ongoing.map(o=>o.level),rows=[];
 for(const a of [...list].sort((a,b)=>a.r-b.r||a.id.localeCompare(b.id))){
  const options=analysts.flatMap((v,j)=>{const q=setupTime(previous[j],a.level,alpha,beta),h=Math.max(6,ready[j],v.a,a.r),s=h+q,c=s+a.p[j];return v.expertise>=a.level&&c<=v.b+1e-9?[{...a,j,q,h,s,c,t:Math.max(0,s-a.d)}]:[];}).sort((a,b)=>a.s-b.s||a.c-b.c||a.j-b.j);
  if(!options.length)return null;const v=options[0];rows.push(v);ready[v.j]=v.c;previous[v.j]=v.level;
 }
 return {rows,z:rows.reduce((v,r)=>v+r.w*r.t,0),prep:rows.reduce((v,r)=>v+r.q,0)};
}
let resultCache=new Map();
function getResult(include=state.newAlarm){const key=[include,state.alpha,state.beta].join(':');if(!resultCache.has(key))resultCache.set(key,schedule(jobs(include)));return resultCache.get(key);}
function table(headers,rows){return `<div class="table-wrap" role="region" aria-label="${headers.join(', ')}" tabindex="0"><table class="doc-table"><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function panel(title,body){return `<section class="panel"><div class="panelheader"><strong>${title}</strong></div>${body}</section>`;}
function badge(s){return `<span class="badge ${s}">${s}</span>`;}
function code(s){return `<code>${s}</code>`;}
function overviewPage(){return `<div class="twocol"><section class="panel hero"><div class="eyebrow">iliskisiz paralel makineler</div><h2>dogru analist.<br>dogru sira.<br><em>daha az sla gecikmesi.</em></h2><p class="lead">yetkinlik ve vardiya kisitlari altinda, uzmanlik gereksinimine bagli asimetrik hazirlik sureleriyle alarm cizelgeleme.</p><button class="btn primary" onclick="go('simulation')">dinamik demoyu ac →</button> <button class="btn" onclick="go('model')">tez modelini incele</button><div class="heroart"><div class="orb"></div><div class="mini-node"><strong>4</strong>kritiklik</div><div class="arrowline"></div><div class="mini-node"><strong>1–5</strong>uzmanlik</div><div class="arrowline"></div><div class="mini-node"><strong>min Σ</strong>wᵢ Tᵢ</div></div></section><aside class="panel padded aside"><div class="eyebrow">son kararlar</div><h3>atama + siralama</h3><div class="numberline"><span>01</span><div><b>alarm = is</b><p>gelis zamani, kritiklik, uzmanlik ve inceleme suresi.</p></div></div><div class="numberline"><span>02</span><div><b>analist = makine</b><p>uzmanlik seviyesi, vardiya ve analiste bagli islem suresi.</p></div></div><div class="numberline"><span>03</span><div><b>baslayan is korunur</b><p>yeni alarmda bekleyen atamalar ve siralar degisebilir.</p></div></div><div class="divider"></div><p>asagidaki hesaplamalar kucuk sentetik ornek icindir. gercek soc performansi veya dogrulanmis insan davranisi iddiasi tasimaz.</p></aside></div><div class="conclusion">secilen fikir: alarmlarin gerektirdigi uzmanlik seviyeleri arasindaki gecis icin <strong>asimetrik ve siraya bagimli hazirlik suresi</strong>.</div>`;}
function scenarioPage(){return `<div class="doc-stack">${panel('analistler · mevcut isler 0. dakikada basladi',table(['analist','uzmanlik Aⱼ','vardiya','devam eden alarm','gereksinim / bitis'],analysts.map((a,j)=>[a.name,a.expertise+' / 5',a.a+'–'+a.b+' dk',ongoing[j].id,'L = '+ongoing[j].level+' / '+ongoing[j].c+' dk'])))}${panel('alarm havuzu · ozellikler geliste etiketli',table(['alarm','kritiklik / wᵢ','Lᵢ','gelis rᵢ','sla sonu dᵢ','pᵢⱼ · deniz / ece / mert'],pending.map(a=>[a.id+'<br><span class="micro">'+a.name+'</span>',badge(a.severity)+' / '+a.w,a.level,a.r+' dk',a.d+' dk',a.p.map((p,j)=>analysts[j].expertise>=a.level?p:'—').join(' / ')+' dk'])))}<p class="caption">a08 yalnizca demoda “acil alarm ekle” secildiginde plana girer. —, uzmanligi yetersiz analisti gosterir. atama uygunlugu Aⱼ ≥ Lᵢ ile belirlenir.</p><div class="modelgrid"><div class="panel padded"><h3>kritiklik ≠ uzmanlik</h3><p class="definition">kritiklik gecikmenin onemini; uzmanlik ise isi incelemek icin gereken yetkinligi tanimlar. ornegin a07 orta kritik ama 5. seviye uzmanlik gerektiriyor.</p></div><div class="panel padded"><h3>sureler neden pᵢⱼ?</h3><p class="definition">sureler is–analist ciftine gore degisir; tek bir sabit hiz oranina indirgenmez. bu nedenle iliskisiz paralel makine yapisi kullanilir. hazirlik suresi bu surelere dahil degildir.</p></div></div><p class="caption">risk agirliklari 1 / 3 / 6 / 10 ve sla toleranslari 45 / 30 / 20 / 10 dk yalnizca demo girdileridir; kurum standardi degildir.</p></div>`;}
function gantt(result,label){if(!result)return `<div class="padded warn">bu senaryoda vardiya ve yetkinlik kisitlariyla tum alarmlari atayan uygulanabilir plan bulunamadi.</div>`;return `<div class="timeline" aria-label="${label}">${analysts.map((a,j)=>`<div class="gantt-row"><div class="timelabel"><span>${a.name} · uzmanlik ${a.expertise}</span><span>${ongoing[j].id} sabit</span></div><div class="track"><div class="nowline" style="left:${6/90*100}%" title="simdi: 6. dakika"></div><span class="segment frozen" style="left:0;width:${ongoing[j].c/90*100}%" title="${ongoing[j].id}: 0–${ongoing[j].c} dk, devam ediyor">${ongoing[j].id} 🔒</span>${result.rows.filter(r=>r.j===j).map(r=>`${r.q?`<span class="segment prep" style="left:${r.h/90*100}%;width:${r.q/90*100}%" title="hazirlik: ${fmt(r.q)} dk"></span>`:''}<span class="segment ${r.severity==='acil'?'urgent':''}" style="left:${r.s/90*100}%;width:${r.p[j]/90*100}%" title="${r.id}: hazirlik ${fmt(r.h)}, inceleme ${fmt(r.s)}, bitis ${fmt(r.c)}">${r.id}</span>`).join('')}</div></div>`).join('')}<div class="axis"><span>0 dk</span><span>30</span><span>60</span><span>90 dk</span></div></div>`;}
function simulationPage(){const r=getResult(),before=getResult(false),b=fifo(jobs());return `<div class="controls-row"><button class="btn primary" onclick="addAlarm()" ${state.newAlarm?'disabled':''}>+ 6. dakikada acil alarm ekle</button><button class="btn" onclick="resetSimulation()">senaryoyu sifirla</button><button class="btn" onclick="downloadResult()" ${!r?'disabled':''}>plani indir</button><span class="note-pill">simdi: 6. dakika</span></div><div class="announce" role="status">${state.newAlarm?'a08 geldi: ilk uc inceleme korunarak bekleyen 5 alarm yeniden cizelgelendi.':'ilk uc inceleme devam ediyor; 4 alarm bekleyen kuyrukta.'}</div><div class="comparison"><div class="metric"><label>risk agirlikli sla gecikmesi</label><strong>${r?fmt(r.z):'—'}</strong><small>Σ wᵢ Tᵢ · agirlik × dk</small></div><div class="metric"><label>sla icinde baslayan</label><strong>${r?r.rows.filter(x=>x.t===0).length:0} / ${jobs().length}</strong><small>yeniden planlanan alarmlar</small></div><div class="metric"><label>toplam ek hazirlik</label><strong>${r?fmt(r.prep):'—'} dk</strong><small>devam edenlerden sonraki gecisler</small></div><div class="metric"><label>fifo referans gecikmesi</label><strong>${b?fmt(b.z):'uygulanamaz'}</strong><small>ayni veri ve hazirlik sureleri</small></div></div><div class="legend"><span><i class="l-frozen"></i>devam eden / sabit</span><span><i class="l-prep"></i>hazirlik</span><span><i></i>inceleme</span><span><i class="l-urgent"></i>yeni acil alarm</span></div>${panel(state.newAlarm?'yeni alarm sonrasi plan':'mevcut plan',gantt(r,'guncel plan'))}${state.newAlarm?`<details class="model-details" style="margin-top:15px"><summary>yeni alarm gelmeden onceki plani karsilastir</summary>${gantt(before,'onceki plan')}<p class="caption">iki planda ayni a01, a02, a03 devam eder; yeni alarm nedeniyle yalnizca bekleyen islerin atama ve sirasi degisebilir. farkli alarm sayilarinin amac degerleri iyilesme yuzdesi olarak karsilastirilmaz.</p></details>`:''}<div style="margin-top:16px">${r?panel('hesaplanan zamanlar',table(['alarm / analist','hazirlik hᵢ','ek sure qᵢ','baslama sᵢ','bitis Cᵢ','sla dᵢ','gecikme Tᵢ'],[...r.rows].sort((a,b)=>a.s-b.s).map(v=>[v.id+' / '+analysts[v.j].name,fmt(v.h),fmt(v.q),fmt(v.s),fmt(v.c),v.d,`<span class="${v.t?'warn':'good'}">${fmt(v.t)} dk</span>`]))):''}</div><div class="conclusion">bu demo, mevcut an itibariyle bilinen kucuk alarm havuzunun atama ve siralarini tam tarama ile karsilastirir. gelecek alarmlari bilmez. acil alarm icin mutlak oncelik zorunlulugu yoktur; wᵢ ve dᵢ amaci etkiler.</div><p class="caption">esit amac degerlerinde toplam tamamlanma zamani, sonra hazirlik suresi yalnizca demo icin baglayici secim kuralidir; tezin ana amaci degismez. fifo, gelis sirasiyla her alarma en erken incelemeye baslayabilen uygun analisti secer. tablo dakika cinsindedir.</p>`;}
function modelPage(){return `<div class="doc-stack"><section class="panel padded"><div class="eyebrow">endustri muhendisligindeki karsilik</div><h2 style="margin-top:15px">asimetrik ve siraya bagimli hazirlik sureli iliskisiz paralel makine cizelgeleme</h2><p>yetkinlik uygunlugu, alarm gelis zamanlari ve vardiya sinirlari birlikte ele alinir. dinamik uygulama, olay tetiklemeli ve is kesmeye izin vermeyen yeniden cizelgelemedir.</p>${table(['soc senaryosu','cizelgeleme karsiligi'],[['guvenlik alarmi','is'],['soc analisti','paralel makine'],['pᵢⱼ','is–makine ciftine bagli islem suresi'],['Aⱼ ≥ Lᵢ','makine uygunlugu'],['uzmanlik seviyeleri arasi gecis','siraya bagimli hazirlik'],['vardiya','makine kullanilabilirligi']])}</section><section class="panel padded"><h2>amac fonksiyonu</h2><div class="formula">min Z = Σ<sub>i ∈ I</sub> w<sub>i</sub> T<sub>i</sub></div><p><strong>risk agirlikli toplam incelemeye baslama gecikmesini en aza indir.</strong> Tᵢ = max(0, sᵢ − dᵢ). pozitif agirliklarla, Tᵢ ≥ sᵢ − dᵢ ve Tᵢ ≥ 0 kisitlari minimizasyonda bu degeri verir.</p><p>sla, hazirlik baslangici veya incelemenin bitisi degil, <strong>incelemeye baslama zamani sᵢ</strong> uzerinden olculur. is yuku dengesi ana amaca eklenmez; ayri raporlanabilir.</p></section><section class="panel padded"><h2>modelin tamamini nasil okumaliyiz?</h2><p>kararlar: xᵢⱼ, πⱼ, hᵢ, sᵢ, Cᵢ ve Tᵢ. πⱼ, analist j'ye atanan alarmlarin sirali listesidir. qᵢ, bu listedeki hemen onceki alarmdan gelen hazirlik suresidir. tum kisitlar bir sonraki bolumde birlikte verilir.</p><p>bu bir <strong>sira listesi ve kosullu iliskilerle yazilmis matematiksel modeldir</strong>. MILP uygulamasinda hemen ardillik ikili degiskenleri ve baglanti kisitlariyla kodlanmalidir; sadece “once gelir” degiskeni hazirlik icin yeterli degildir.</p><button class="btn primary" onclick="go('constraints')">kisitlari ac →</button></section><section class="panel padded"><h2>literatur baglantisi</h2><p><a href="https://informs-sim.org/wsc24papers/con258.pdf" target="_blank" rel="noopener noreferrer">cho, kim ve monch (2024) — gelis zamanlari, makine uygunlugu ve hazirlik sureli iliskisiz paralel makine cizelgeleme</a>. bu calismada gecikme tamamlanma uzerindendir; bizim modelimizde incelemeye baslama uzerindedir.</p><p>uzmanlik seviyesine gore artan/azalan asimetrik sure kurali bizim soc uyarlamamiz ve sinanacak varsayimimizdir; kaynakta dogrulanmis bir insan davranisi sonucu olarak sunulmaz.</p></section></div>`;}
const parameterRows=[

['rᵢ','dakika','alarm gelis zamani; hazirlik bu andan once baslamaz.'],

['δᵢ; dᵢ = rᵢ + δᵢ','dakika','sla toleransi ve mutlak incelemeye baslama son zamani.'],
['Lᵢ ∈ {1,…,5}','seviye','alarmin gerektirdigi minimum uzmanlik.'],
['Aⱼ ∈ {1,…,5}','seviye','analistin sabit uzmanligi; onceki isi nedeniyle degismez.'],

function parametersPage(){return `<div class="doc-stack">${panel('parametre sozlugu',table(['sembol','birim / alan','anlami'],parameterRows.map(r=>[code(r[0]),r[1],r[2]])))}<div class="conclusion">tahmini sureler, kritiklik ve uzmanlik gereksinimleri alarm gelisinde etiketli kabul edilir. bu etiketleri tahmin eden makine ogrenmesi sistemi ilk modelin kapsaminda degildir.</div></div>`;}
function variablesPage(){return `<div class="doc-stack">${panel('karar degiskenleri',table(['sembol','deger alani','anlami'],[
['xᵢⱼ','{0,1}','alarm i analist j’ye atanirsa 1, aksi halde 0.'],['πⱼ','sirali liste','analist j’nin inceleyecegi alarmlarin sirasi; her atanan alarm tam bir kez bulunur.'],['hᵢ','≥ 0, dakika','alarm i icin hazirliga baslama zamani.'],['sᵢ','≥ 0, dakika','hazirliktan sonra incelemeye baslama zamani; sla bu ana gore olculur.'],['Cᵢ','≥ 0, dakika','alarm incelemesinin bitis zamani.'],['Tᵢ','≥ 0, dakika','sla son zamaninin asilma miktari; amac fonksiyonunda cezalandirilir.']
].map(r=>[code(r[0]),r[1],r[2]])))}<section class="panel padded"><h2>turetilen ifadeler</h2><div class="formula small">pred(i, πⱼ) = i’nin hemen onceki alarmi<br>qᵢ = q<sub>pred(i,πⱼ), i</sub></div><p>qᵢ bagimsiz ve serbest secilen bir sure degildir. modelin sectigi sira, onceden hesaplanan qᵢₖ tablosundan hangi surenin uygulanacagini belirler. ilk is icin q₀ᵢ = 0; dinamik planda onceki devam eden/son is referans alinir.</p><p>hᵢ, sᵢ ve Cᵢ karar degiskenleri olsa da aralarindaki iliskiler hazirlik, islem ve siralama kisitlariyla belirlenir.</p></section><section class="panel padded"><h2>neden hemen onceki alarm?</h2><p>a → b → c sirasinda c’nin hazirligi b’den hesaplanir. a da c’den once gelir ama a → c gecis suresi eklenmez. bu nedenle genel “once gelme” ile “hemen ardillik” farklidir.</p></section></div>`;}
const constraints=[
['tek analiste atama','Σⱼ xᵢⱼ = 1  ∀i','her alarm tam bir analiste atanir. model alarmi sessizce disarida birakamaz.'],
['yetkinlik uygunlugu','xᵢⱼ ≤ eᵢⱼ;  eᵢⱼ = 1[Aⱼ ≥ Lᵢ]','analistin seviyesi alarmin gerektirdigi seviyeden dusukse atama yapilamaz.'],
['atama ve siralama tutarliligi','πⱼ = {i : xᵢⱼ = 1} kumesinin bir permutasyonu','her atanan is listede tam bir kez yer alir; atanmayan is listede bulunmaz. bos analist listesine izin verilir.'],
['gelis zamani','hᵢ ≥ rᵢ','alarm gelmeden ona ozel hazirlik baslayamaz.'],
['vardiya baslangici','xᵢⱼ = 1 ⇒ hᵢ ≥ aⱼ','hem hazirlik hem inceleme analistin vardiyasinda yer alir.'],
['siraya bagimli hazirlik','sᵢ = hᵢ + qᵢ','qᵢ hemen onceki alarmin ve yeni alarmin uzmanlik gereksiniminden hesaplanir. ilk vardiya isi icin q₀ᵢ = 0.'],
['kesintisiz inceleme','Cᵢ = sᵢ + Σⱼ pᵢⱼ xᵢⱼ','tek analiste atama nedeniyle toplam, secilen analistin suresini verir. is bolunmez ve inceleme araya baska bir is almaz.'],
['is ve hazirlik cakismamasi','k, πⱼ icinde i’nin hemen ardindaysa: hₖ ≥ Cᵢ','bir analist ayni anda iki inceleme veya bir incelemeyle sonraki hazirligi yurutemez. esdeger olarak sₖ ≥ Cᵢ + qᵢₖ.'],
['vardiya bitisi','xᵢⱼ = 1 ⇒ Cᵢ ≤ bⱼ','alarmin incelemesi vardiya bitmeden tamamlanir. vardiya devri ve fazla mesai ilk modelde yoktur.'],
['sla gecikmesi','Tᵢ ≥ sᵢ − dᵢ;  Tᵢ ≥ 0','sla yumusak hedeftir: gecikmeye izin verilir ama agirlikli ceza olusur. acil alarm icin kesin ilk-sira kisiti yoktur.'],
['degisken alanlari','xᵢⱼ ∈ {0,1};  hᵢ, sᵢ, Cᵢ, Tᵢ ≥ 0','atama ikili; zamanlar ve gecikme negatif olmayan surekli degerlerdir. πⱼ sonlu sirali listedir.'],
['dinamik yeniden planlama','i ∉ F ⇒ hᵢ ≥ τ;  i ∈ F ⇒ (xᵢⱼ,hᵢ,sᵢ,Cᵢ) = onceki plan degerleri','islem veya hazirligi baslayan isler sabitlenir ve analist sirasinin korunmus on ekini olusturur. yeni kuyruk bu islerden sonra baslar; bekleyen isler yeniden atanabilir. tamamlanmis gecmis isler optimizasyon disinda tutulup son uzmanlik baglami saklanabilir.']
];
function constraintsPage(){return `<div class="doc-stack"><div class="conclusion">asagidaki 1–11 temel modeldir. 12, her yeni alarmda calisan yeniden planlama kuralidir. xᵢⱼ = 1 ⇒ ... ifadeleri yalnizca atanilan analist icin gecerlidir. πⱼ ile verilen model tam bir siralama tanimidir; henuz MILP kodlamasi degildir.</div><div class="controls-row"><button class="btn small" onclick="expandConstraints(true)">tum kisitlari ac</button><button class="btn small" onclick="expandConstraints(false)">tumunu kapat</button></div>${constraints.map((c,i)=>`<details class="model-details constraint" ${i===0?'open':''}><summary><span class="constraint-number">${String(i+1).padStart(2,'0')}</span>${c[0]}</summary><div class="equation">${c[1]}</div><p class="definition">${c[2]}</p></details>`).join('')}<section class="panel padded"><h2>dinamik baslangic baglami</h2><p>analistin siradaki ilk bekleyen isi k icin hₖ ≥ max(τ, aⱼ, Rⱼ, rₖ) ve qₖ = q(ℓⱼ,Lₖ) kullanilir. analistin gecmis isi yoksa qₖ = 0. devam eden is bittiginde uzmanlik gecis hazirligi baslar; yeni plan “ilk is” diyerek bunu sifirlamaz.</p><p>tum alarmlari vardiyalara yerlestirmek mumkun degilse <strong>uygulanabilir plan yok</strong> sonucu verilir. bu ilk modelde alarm atlamaya, fazla mesaiye veya yetkinlik ihlaline izin verilmez.</p></section></div>`;}
function setupPage(){const rows=Array.from({length:5},(_,i)=>[code('L = '+(i+1)),...Array.from({length:5},(_,k)=>`<span class="${i===k?'good':k>i?'warn':''}">${fmt(setupTime(i+1,k+1))}</span>`)]);return `<div class="doc-stack"><section class="panel padded"><h2>secilen fikir · uzmanlik gecisine bagli hazirlik</h2><div class="formula small">qᵢₖ = α (Lₖ − Lᵢ)² &nbsp; eger Lₖ &gt; Lᵢ<br>qᵢₖ = 0 &nbsp; eger Lₖ = Lᵢ<br>qᵢₖ = β / (Lᵢ − Lₖ) &nbsp; eger Lₖ &lt; Lᵢ</div><p>artan uzmanlik gereksinimine geciste ek hazirlik buyur. azalan gereksinime geciste sure kisalir; bu varsayimda 5 → 2 gecisi, 5 → 4 gecisinden daha kisadir. ayni seviyede uzmanlik degisiminden kaynaklanan ek hazirlik sifirdir.</p><form id="setupForm" class="controls-row"><label>α · yukari gecis<input id="alphaInput" type="number" min="0.1" max="5" step="0.1" value="${state.alpha}" required></label><label>β · asagi gecis<input id="betaInput" type="number" min="0.1" max="5" step="0.1" value="${state.beta}" required></label><button class="btn primary" type="submit">uygula ve yeniden hesapla</button></form><p class="caption">0 &lt; β ≤ α: asagi gecisin yukari gecisten daha uzun olmamasi icin. katsayilar deneyseldir; varsayilan α = 1, β = 0,5. degisiklikler dinamik demoya da uygulanir.</p><p id="setupError" class="warn" role="alert"></p></section>${panel('gecis matrisi · satir: onceki / sutun: sonraki · dakika',table(['onceki ↓ / sonraki →','1','2','3','4','5'],rows))}<div class="modelgrid"><section class="panel padded"><h3>makine benzetmesi</h3><p class="definition">makinenin bir isten digerine gecerken yeni gereksinime uygun hale getirilmesi. gecis yonleri ayni sureyi gerektirmez: qᵢₖ ≠ qₖᵢ olabilir.</p></section><section class="panel padded"><h3>analist yetkinligi degismez</h3><p class="definition">Aⱼ sabittir. hazirlik, analistin yeni bir yetkinlik ogrenmesi degil, zaten yapabildigi yeni incelemeye hazirlanmasidir. Aⱼ &lt; Lₖ ise uzun hazirlik vererek atama yapmak mumkun degildir.</p></section></div><div class="conclusion">bu sekilsel iliski dogrulanmis bir insan davranisi yasasi degildir. uzman gorusu, olcum ve farkli gecis matrisleriyle duyarlilik analizi gerekir. buyuk yukari gecis yerine araya bir is koymak toplam hazirligi azaltabilir; bu etkinin gercekciligi de sinanmalidir.</div></div>`;}
function assumptionsPage(){return `<div class="doc-stack"><section class="panel padded"><h2>son kabul edilen model kararlari</h2><ul><li>kritiklik: dusuk, orta, yuksek, acil. gerekli uzmanlik ve analist yetkinligi: 1–5.</li><li>alarm ozellikleri geliste bilinir. inceleme sureleri tahmini ve planlama aninda deterministik kabul edilir.</li><li>ust uzmanlik seviyeleri alt seviyeleri kapsar. uzmanlik alanlari arasindaki farklar ilk modelde tek seviyeye indirgenmistir.</li><li>her alarm tek analiste atanir. analist ayni anda tek is/hazirlik yapar; inceleme kesilmez.</li><li>amac, risk agirlikli incelemeye baslama gecikmesidir. yuk dengesi ayri olculebilir.</li><li>hazirlik seviye gecisine baglidir; ayni seviyede sifir ek hazirlik kabul edilir. ture bagli diger hazirliklar bu ilk modelde ayrica modellenmez.</li><li>yeni alarmda olay tetiklemeli yeniden planlama yapilir. baslamis hazirlik ve incelemeler korunur; bekleyen atamalar serbesttir.</li><li>ilk vardiya isi icin q₀ᵢ = 0. bos beklemek uzmanlik baglamini otomatik sifirlamaz; uzun bosluk sonrasi etkiler kapsam disidir.</li><li>vardiya icinde tum isler bitmelidir. uygulanamaz durumlar deneylerde ayrica raporlanir.</li></ul></section><div class="modelgrid"><section class="panel padded"><span class="tag orange">elenen fikir 1</span><h3>alarm turune gore hazirlik</h3><p class="definition">endustri karsiligi: urun ailesine bagli, siraya bagimli hazirlik sureli paralel makine cizelgeleme. ornegin farkli urunlerde temizlik veya ayar.</p><p class="definition">eleme gerekcesi: cok sayida alarm turu arasinda guvenilir gecis sureleri belirlemek daha fazla veri gerektiriyor. uzmanlik seviyeleriyle daha az parametre kullaniliyor.</p></section><section class="panel padded"><span class="tag orange">elenen fikir 2</span><h3>ortak analiz araci kapasitesi</h3><p class="definition">endustri karsiligi: ek kaynak kisitli paralel makine cizelgeleme. birden fazla makinenin ayni sinirli ekipmana ihtiyac duymasi.</p><p class="definition">eleme gerekcesi: mevcut soc senaryosunda bu tur bir ortak kaynak darbogazi tanimlanmadi; ek ve dayanaklandirilmasi gereken bir varsayim olusturuyor.</p></section></div><section class="panel padded"><span class="tag">secilen fikir 3</span><h3>uzmanlik gereksinimine bagli asimetrik hazirlik</h3><p class="definition">alarm turlerini sinirlamadan ortak uzmanlik olcegiyle uygulanabilir. katkisi, bu uyarlamanin ve dinamik cizelgeleme politikasinin hangi kosullarda yarar sagladigini incelemektir; hazirlik suresinin kendisi yeni bir literatur kavrami degildir.</p></section><section class="panel padded"><h2>deneylerde olculecekler</h2><p>risk agirlikli sla gecikmesi, kritik/acil alarmlarin zamaninda baslama orani, toplam hazirlik, analist yuk dagilimi, cozum suresi ve uygulanamaz senaryo orani.</p><p>hazirlik surelerini dikkate alan ve almayan planlar, degerlendirmede ayni gerceklesen hazirlik kosullarina tabi tutulur. bu sayfadaki demo genel bir olceklenebilir MILP cozucusu veya gercek operasyon validasyonu degildir.</p></section></div>`;}
const views={overview:overviewPage,scenario:scenarioPage,simulation:simulationPage,model:modelPage,parameters:parametersPage,variables:variablesPage,constraints:constraintsPage,setup:setupPage,assumptions:assumptionsPage};
function navButton(p,i){return `<button class="navstep ${state.page===p[0]?'selected':''}" ${state.page===p[0]?'aria-current="page"':''} onclick="go('${p[0]}')"><span class="num">${String(i+1).padStart(2,'0')}</span>${p[1]}</button>`;}
function render(){const idx=pages.findIndex(p=>p[0]===state.page),p=pages[idx];$('eyebrow').textContent=p[2];$('title').textContent=p[3];$('subtitle').textContent=p[4];$('pageNum').textContent=String(idx+1).padStart(2,'0');$('navItems').innerHTML=pages.slice(0,3).map(navButton).join('')+`<details id="modelMenu" ${state.modelOpen?'open':''}><summary>tez modeli</summary><div>${pages.slice(3,8).map((p,i)=>navButton(p,i+3)).join('')}</div></details>`+navButton(pages[8],8);$('modelMenu').addEventListener('toggle',e=>state.modelOpen=e.target.open);$('content').innerHTML=views[state.page]();$('progress').innerHTML=pages.map((_,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('');$('prevBtn').disabled=idx===0;$('nextBtn').textContent=idx===pages.length-1?'basa don ↺':'devam et →';$('notes').textContent=noteText[state.page];$('notes').classList.toggle('visible',state.notes);if($('setupForm'))$('setupForm').addEventListener('submit',applySetup);}
function go(page){if(!views[page])return;state.page=page;if(pages.findIndex(p=>p[0]===page)>=3&&page!=='assumptions')state.modelOpen=true;if(location.hash.slice(1)!==page)history.pushState(null,'','#'+page);render();window.scrollTo({top:0,behavior:'instant'});$('title').focus({preventScroll:true});}
let toastTimer;function toast(msg){clearTimeout(toastTimer);$('toast').textContent=msg;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4000);}
function addAlarm(){if(state.newAlarm)return;state.newAlarm=true;render();toast('a08 eklendi; baslamis isler korunarak kuyruk yeniden planlandi.');}
function resetSimulation(){state.newAlarm=false;state.alpha=1;state.beta=.5;resultCache.clear();render();toast('senaryo ve hazirlik katsayilari sifirlandi.');}
function applySetup(e){e.preventDefault();const a=Number($('alphaInput').value),b=Number($('betaInput').value);if(!Number.isFinite(a)||!Number.isFinite(b)||a<.1||b<.1||a>5||b>5||b>a){$('setupError').textContent='0,1 ≤ β ≤ α ≤ 5 olacak sekilde katsayi gir.';return;}state.alpha=a;state.beta=b;resultCache.clear();render();toast('gecis matrisi guncellendi. dinamik demo bu katsayilari kullanacak.');}
function expandConstraints(open){document.querySelectorAll('.constraint').forEach(e=>e.open=open);}
function downloadResult(){const r=getResult();if(!r)return;const payload={scenario:'sentetik tez demosu',model:'risk agirlikli incelemeye baslama gecikmesi',now:6,alpha:state.alpha,beta:state.beta,ongoing,objective:r.z,rows:r.rows,limitations:'kucuk ornekte tam tarama; genel MILP cozucusu degildir'};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='soc-cizelge.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function toggleNotes(){state.notes=!state.notes;$('notes').classList.toggle('visible',state.notes);$('notesBtn').setAttribute('aria-pressed',String(state.notes));}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('bu pencerede tam ekran desteklenmiyor.');}}
$('prevBtn').onclick=()=>go(pages[Math.max(0,pages.findIndex(p=>p[0]===state.page)-1)][0]);$('nextBtn').onclick=()=>go(pages[(pages.findIndex(p=>p[0]===state.page)+1)%pages.length][0]);$('notesBtn').onclick=toggleNotes;$('fullBtn').onclick=fullscreen;$('motionBtn').onclick=()=>{state.motion=!state.motion;document.body.classList.toggle('no-motion',!state.motion);$('motionBtn').textContent=state.motion?'hareketi durdur':'hareketi baslat';};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();$('nextBtn').click();}if(e.key==='ArrowLeft'){e.preventDefault();$('prevBtn').click();}if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')fullscreen();});
window.addEventListener('popstate',()=>{const p=location.hash.slice(1);if(views[p]){state.page=p;if(pages.findIndex(x=>x[0]===p)>=3&&p!=='assumptions')state.modelOpen=true;render();}});
const initial=location.hash.slice(1);if(views[initial]){state.page=initial;state.modelOpen=pages.findIndex(p=>p[0]===initial)>=3;}render();
</script></body></html>
