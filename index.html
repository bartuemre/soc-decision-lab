function alerts(){return data.slice(0,state.surge?7:6).sort((a,b)=>b.p-a.p||a.id.localeCompare(b.id));}
function weights(){let s=state.weights.reduce((a,b)=>a+b,0);return s?state.weights.map(v=>v/s):[.25,.25,.25,.25];}
function evaluate(assign){
 const list=alerts(),load=analysts.map(a=>a.base),completion={},late={},sumP=list.reduce((s,a)=>s+a.p,0);let risk=0,fit=0,timely=0,served=0,onTime=0;
 for(const a of list){const j=assign[a.id];if(j===undefined||j<0)continue;load[j]+=a.time[j];completion[a.id]=load[j];late[a.id]=load[j]>a.due;risk+=a.p;fit+=a.skill[j]/5;served++;if(!late[a.id]){timely+=a.p;onTime++;}}
 const balance=1-(Math.max(...load)-Math.min(...load))/H;
 const components=[risk/sumP,fit/list.length,timely/sumP,balance];
 const score=components.reduce((s,v,i)=>s+v*weights()[i],0);
 return {assign:{...assign},load,completion,late,served,onTime,components,score,spread:Math.max(...load)-Math.min(...load)};
}
function baseline(){
 let assign={},load=analysts.map(a=>a.base);
 for(const a of alerts()){const options=[0,1,2].filter(j=>a.skill[j]>=3&&load[j]+a.time[j]<=H).sort((a,b)=>load[a]-load[b]||a-b);if(options.length){const j=options[0];assign[a.id]=j;load[j]+=a.time[j];}}
 return evaluate(assign);
}
function optimize(){
 const list=alerts();let best=null,visited=0,load=analysts.map(a=>a.base),assign={};
 function visit(i){
  if(i===list.length){visited++;const r=evaluate(assign);if(!best||r.score>best.score+1e-10)best=r;return;}
  const a=list[i];
  for(let j=0;j<3;j++){if(a.skill[j]<3||load[j]+a.time[j]>H)continue;assign[a.id]=j;load[j]+=a.time[j];visit(i+1);load[j]-=a.time[j];}
  delete assign[a.id];visit(i+1);
 }
 visit(0);return {...best,visited};
}

function weightFormula(){return 'max Z = '+weights().map((w,i)=>`${w.toFixed(2)}${['R','U','S','D'][i]}`).join(' + ');}
function changeWeight(i,v){state.weights[i]=+v;invalidate();for(let k=0;k<4;k++)$('weightValue'+k).textContent=Math.round(weights()[k]*100)+'%';$('weightEquation').innerHTML=weightFormula()+'<span class="muted">R: risk kapsamı · U: uzmanlık · S: SLA · D: denge<br>Ölçütler 0–1 aralığında. Tüm girdiler sıfırsa eşit ağırlık kullanılır.</span>';}
function preset(w){state.weights=w;invalidate();render();toast('Karar politikası güncellendi. Modeli yeniden çözebilirsin.');}
function modelPage(){

 <div class="modelgrid"><div class="panel modelcard"><h3>Modelin dili <span class="tag" style="float:right">MILP TASLAĞI</span></h3>
 <div class="mathrow"><code>${level>=1?'xᵢⱼ ∈ {0,1}':'xᵢⱼ = ?'}</code><p>${level>=1?'Alarm i, analist j’ye atanırsa 1; aksi halde 0.':'İlk adım: atama kararını bir değişkenle tanımla.'}</p></div>
 ${level>=1?'<div class="mathrow"><code>zᵢ = Σⱼ xᵢⱼ &nbsp; · &nbsp; yᵢ ∈ {0,1}</code><p>zᵢ: alarmın atanması. yᵢ: atanan alarmın süre hedefini aşması.</p></div>':''}

 </div><div class="panel modelcard"><h3>Operasyonun kuralları</h3>${level>=3?`
 <div class="mathrow"><code>Σⱼ xᵢⱼ ≤ 1 &nbsp; · &nbsp; xᵢⱼ ≤ eᵢⱼ</code><p><b>Tek atama + yetkinlik:</b> Her alarm en fazla bir analiste; sᵢⱼ ≥ 3 ise eᵢⱼ = 1.</p></div>
 <div class="mathrow"><code>Lⱼ = bⱼ + Σᵢ dᵢⱼ xᵢⱼ ≤ H</code><p><b>Kapasite:</b> Mevcut iş bⱼ ve yeni işler dᵢⱼ toplamı ufku aşamaz.</p></div>
 <div class="mathrow"><code>Cᵢⱼ = bⱼ + Σₖ≤ᵢ dₖⱼ xₖⱼ</code><code>Cᵢⱼ ≤ tᵢ + M(1−xᵢⱼ) + Myᵢ</code><code>yᵢ ≤ zᵢ</code><p><b>SLA:</b> Sabit önem sırasında tamamlanma hedefi aşılırsa ihlal işaretlenir. M = H = 85 yeterlidir.</p></div>
 <div class="mathrow"><code>Lmin ≤ Lⱼ ≤ Lmax &nbsp; ∀j</code><p><b>Denge:</b> En yoğun ve en az yoğun analist arasındaki fark ölçülür.</p></div>`:`<div style="padding:25px 0"><div class="numberline"><span>01</span><div><b>Bir alarma bir sorumlu</b><p>Atanmayan alarm kuyrukta kalabilir.</p></div></div><div class="numberline"><span>02</span><div><b>Uygun yetkinlik ve yeterli kapasite</b><p>Herkes her alarmı alamaz.</p></div></div><div class="numberline"><span>03</span><div><b>Süre hedefi ve yük dengesi</b><p>Atamaları tek tek değil, birlikte değerlendir.</p></div></div></div>`}</div></div>
 <div class="solvebar">${level<3?`<button class="btn primary" onclick="state.modelLevel++;render()">${['Değişkenleri oluştur','Amaç fonksiyonunu ekle','Kısıtları ekle'][level]} →</button>`:`<button class="btn primary" id="solveBtn" onclick="solve()">Modeli çöz & atamaları üret ↗</button>`}<button class="btn small" onclick="showAssumptions()">Varsayımlar & teknik not</button><p id="solveStatus">Demo: ${alerts().length} alarm × 3 analist. Küçük örnekte uygulanabilir atamalar tam taramayla karşılaştırılır; bu sayfa bir MILP çözücüsü çağırmaz.</p></div>`;
}
function solve(){
 if(state.busy)return;state.busy=true;$('solveBtn').disabled=true;
 const result=optimize();state.solved=result;state.approved=false;
 $('solveStatus').textContent='Uygunluk ve kapasite kısıtları kontrol edildi…';
 later(()=>{$('solveStatus').textContent=`${result.visited.toLocaleString('tr-TR')} uygulanabilir atama değerlendirildi. Ağırlıklı amaç değeri: ${result.score.toFixed(4)}.`;},450);
 later(()=>{state.busy=false;go(5);toast('Bu senaryo ve ağırlıklar için en iyi atama bulundu.');},1150);
}
function metric(label,value,before,detail){return `<div class="metric"><label>${label}</label><strong>${value}</strong><small>Kural tabanlı: ${before}</small><small class="diff">${detail}</small></div>`;}

 <div class="resultgrid"><div class="panel"><div class="panelheader"><strong>Önerilen atamalar</strong><span class="tag">Z = ${r.score.toFixed(3)}</span></div><table class="resulttable"><thead><tr><th>Alarm</th><th>Analist</th><th>Bitiş / hedef</th><th>Durum</th></tr></thead><tbody>${list.map(a=>{const j=r.assign[a.id];return `<tr><td><span style="color:${severity[a.level]}">●</span> ${a.id}</td><td>${j===undefined?'Kuyrukta':analysts[j].name}</td><td>${j===undefined?'—':r.completion[a.id]+' / '+a.due+' dk'}</td><td class="${j===undefined||r.late[a.id]?'warn':'good'}">${j===undefined?'Atanmadı':r.late[a.id]?'SLA aşımı':'Süresinde'}</td></tr>`;}).join('')}</tbody></table></div>

 <div class="conclusion"><b>${unassigned.length?`${unassigned.map(a=>a.id).join(', ')} kuyrukta kaldı.`:'Tüm alarmlar kapasite içinde atandı.'}</b> ${r.onTime===r.served?'Atanan alarmların tamamı süre hedefinde.':`${r.served-r.onTime} atamada süre hedefi aşılıyor.`} Modelin ağırlıklı puanı <b>${r.score.toFixed(3)}</b>; karşılaştırma kuralının puanı <b>${b.score.toFixed(3)}</b>. Bu sonuç yalnızca seçili sentetik senaryo ve ağırlıklar için geçerlidir.</div>
 <div class="solvebar"><button class="btn primary" onclick="approve()" ${state.approved?'disabled':''}>${state.approved?'✓ Öneri onaylandı':'Supervisor olarak onayla ✓'}</button><button class="btn small" onclick="showComparison()">Atama kararlarını karşılaştır</button><button class="btn small" onclick="showRoom()">Operasyon odasını göster</button><button class="btn small" onclick="downloadResult()">Sonucu indir ↓</button></div><div class="caption">Referans kural: önem sırasıyla, yeterli yetkinliği ve kapasitesi olan en az yüklü analiste ata. Her iki yöntemde iş sırası aynı. Ağırlıklı puanın artması her ölçütün tek tek iyileştiği anlamına gelmez.</div>`;

}
function resetDemo(){clearPending();state={step:0,surge:false,weights:[35,25,30,10],manual:{},arrived:false,modelLevel:0,solved:null,approved:false,notes:state.notes,motion:state.motion,busy:false};render();toast('Sunum başlangıç durumuna döndü.');}
function toggleNotes(){state.notes=!state.notes;$('notes').classList.toggle('visible',state.notes);$('notesBtn').setAttribute('aria-pressed',state.notes);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('Tam ekran bu pencerede desteklenmiyor. Tarayıcıda F11 kullanabilirsin.');}}
$('prevBtn').onclick=()=>go(state.step-1);$('nextBtn').onclick=()=>go(state.step===6?0:state.step+1);
$('notesBtn').onclick=toggleNotes;$('fullBtn').onclick=fullscreen;
$('motionBtn').onclick=()=>{state.motion=!state.motion;document.body.classList.toggle('no-motion',!state.motion);$('motionBtn').textContent=state.motion?'Hareketi durdur':'Hareketi başlat';};
$('details').addEventListener('click',e=>{if(e.target===$('details')){const r=$('details').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('details').close();}});
document.addEventListener('keydown',e=>{if($('details').open||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(state.step+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.step-1);}if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')fullscreen();});
render();
</script>
